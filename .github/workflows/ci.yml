name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
          - os: ubuntu-latest
            go: stable
          # macOS 26 requires Mach-O metadata that Go 1.22 does not emit.
          - os: macos-latest
            go: stable
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check per-process memory measurement and timeout cleanup
        run: python3 -S -m unittest discover -s scripts -p '*_test.py' -v
      - name: Replay the archived Intel Q4 measurements
        if: matrix.go == '1.22.x'
        run: python3 -B -S -m unittest discover -s validation/performance/q4-intel-avx2-20261125
      - name: Compile isolated offline probes without model weights
        run: python3 -S scripts/check_probe_builds.py
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -trimpath -o monolith ./cmd/monolith
      - name: Cross-build the Darwin arm64 kernel with Go 1.22
        if: matrix.go == '1.22.x'
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/monolith-arm64" ./cmd/monolith
      - name: Exercise AVX2 selection and the pure Go fallback on Linux
        if: runner.os == 'Linux'
        run: |
          MONOLITH_Q4_FFN_AVX2=1 go test -race -count=1 -run '^TestQ4FFN' ./cmd/monolith
          MONOLITH_Q4_FFN_AVX2=all go test -race -count=1 -run '^TestQ4FFN' ./cmd/monolith
          MONOLITH_Q4_FFN_AVX2=all+attention go test -race -count=1 -run '^TestQ4(Attention|FFN)' ./cmd/monolith
          if /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)' >/dev/null; then
            MONOLITH_Q4_FFN_AVX2=all+attention GOAMD64=v3 go test -count=1 -run '^TestQ4' ./cmd/monolith
          fi
          MONOLITH_Q4_FFN_AVX2=all+attention go test -tags=purego -run '^TestQ4' ./cmd/monolith
      - name: Exercise native Q4 opt-in on macOS
        if: runner.os == 'macOS'
        run: |
          MONOLITH_Q4_FFN_NEON=1 go test -race -count=1 -run '^TestQ4FFN' ./cmd/monolith
          MONOLITH_Q4_FFN_NEON=all go test -race -count=1 -run '^TestQ4FFN' ./cmd/monolith
          MONOLITH_Q4_FFN_NEON=all+attention go test -race -count=1 -run '^TestQ4(Attention|FFN)' ./cmd/monolith
      - name: Exercise the pure Go Q4 fallback on macOS
        if: runner.os == 'macOS'
        run: MONOLITH_Q4_FFN_NEON=all+attention go test -tags=purego -run '^TestQ4' ./cmd/monolith
      - name: Exercise CLI and deterministic resume
        run: ./scripts/smoke.sh
